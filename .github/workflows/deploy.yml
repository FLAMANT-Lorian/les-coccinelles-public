name: Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no forge@${{ secrets.SERVER_IP }} "
          cd /home/forge/les-coccinelles.on-forge.com &&
          git pull origin main
          "
